<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Weakest in-channel SNR at which each RelayStation detector path first validates a tag, synthetic noise bench: Welch +9 dB, STFT -9 dB, matched filter -15 dB, matched filter with fold -18 dB at 91 s and -21 dB at 141 s.">
