<text x="24" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb6c3">Longer bar = hears a fainter tag. Bench on synthetic noise, 2026-09-09; the outdoor range walk is not yet redone.</text>
