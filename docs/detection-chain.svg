<svg xmlns="http://www.w3.org/2000/svg" width="894" height="196" viewBox="0 0 894 196" role="img" aria-label="RelayStation detection chain">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb6c3"/></marker></defs>
<rect x=".5" y=".5" width="893" height="195" rx="14" fill="#0b1f33" stroke="#1b6f6b" stroke-opacity=".6"/>
<text x="20" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6f2f1">RelayStation detection chain</text>
<rect x="20" y="64" width="150" height="86" rx="10" fill="#2bb3a9" fill-opacity=".12" stroke="#2bb3a9" stroke-opacity=".7"/><text x="32" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#2bb3a9">01</text><text x="32" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">SDR read</text><text x="32" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">128 ms of IQ</text><text x="32" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">2.048 Msps</text><path d="M174,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="196" y="64" width="150" height="86" rx="10" fill="#2bb3a9" fill-opacity=".12" stroke="#2bb3a9" stroke-opacity=".7"/><text x="208" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#2bb3a9">02</text><text x="208" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">STFT survey</text><text x="208" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">500 Hz bins, CFAR</text><text x="208" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">fitted per station</text><path d="M350,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="372" y="64" width="150" height="86" rx="10" fill="#2bb3a9" fill-opacity=".12" stroke="#2bb3a9" stroke-opacity=".7"/><text x="384" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#2bb3a9">03</text><text x="384" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Matched filter</text><text x="384" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">per-tag, 16 kHz</text><text x="384" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">Exp(1) normalised</text><path d="M526,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="548" y="64" width="150" height="86" rx="10" fill="#2bb3a9" fill-opacity=".12" stroke="#2bb3a9" stroke-opacity=".7"/><text x="560" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#2bb3a9">04</text><text x="560" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Period fold</text><text x="560" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">finds tags too weak</text><text x="560" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">for one pulse</text><path d="M702,107 h16" stroke="#9fb6c3" stroke-width="1.6" marker-end="url(#arr)"/><rect x="724" y="64" width="150" height="86" rx="10" fill="#f2a93b" fill-opacity=".12" stroke="#f2a93b" stroke-opacity=".7"/><text x="736" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f2a93b">05</text><text x="736" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6f2f1">Validate + lock</text><text x="736" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">5 pulses, then</text><text x="736" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">report to Central</text>
<text x="20" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb6c3">Every channel-frame lands in exactly one pipeline stage, and the counts ride the heartbeat, so a deaf station cannot look healthy.</text>
</svg>